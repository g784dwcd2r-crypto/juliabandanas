extends: theme-check:recommended

RemoteAsset:
  # Fraunces and Inter are the whole typographic identity. Fraunces is loaded
  # with its optical-size, SOFT and WONK axes because the Typography settings
  # drive them, and Shopify's hosted font library does not expose those axes.
  # Both are loaded non-render-blocking (media="print" swap).
  enabled: false
