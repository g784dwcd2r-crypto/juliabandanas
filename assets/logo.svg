<?xml version="1.0" encoding="UTF-8"?>
<!--
  Julia Mind wordmark, as a standalone file for socials, packaging and email
  signatures. The site itself does NOT use this file — it sets the wordmark as
  live text in snippets/logo.liquid so it stays sharp and follows the theme's
  typography settings. This is only for places that need an image.

  The text is not outlined, so it falls back to a system serif wherever
  Fraunces is not installed. For print, open it in a vector editor and convert
  the text to paths first.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="Julia Mind, Season 01">
  <rect width="420" height="96" fill="#FAF8F3"/>
  <text x="28" y="63"
        font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="46" font-weight="500" letter-spacing="-0.9" fill="#17171A">Julia Mind</text>
  <text x="292" y="40"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="14" font-weight="600" letter-spacing="2.2" fill="#B8863C">01</text>
</svg>
